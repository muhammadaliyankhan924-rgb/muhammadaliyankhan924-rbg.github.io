
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Task | TechNova Guide</title>
  <meta name="description" content="Submit your completed TechNova Guide task for review.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #20243a;
    }
    header {
      background: #34216b;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }
    main {
      max-width: 650px;
      margin: 35px auto;
      padding: 25px;
    }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd0dd;
      border-radius: 8px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #4930a0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }
    .back { color: white; }
    footer { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>TechNova Guide</h1>
    <p>Submit Your Completed Task</p>
    <a class="back" href="index.html">Back to Home</a>
  </header>

  <main>
    <section class="panel">
      <h2>Task Submission</h2>
      <p>Log in first, then enter the task ID and your proof of completion.</p>

      <form id="taskForm">
        <label for="taskId">Task ID</label>
        <input id="taskId" type="number" min="1" step="1"
          placeholder="Enter the task ID" required>

        <label for="proof">Proof / Answer</label>
        <textarea id="proof" maxlength="2000"
          placeholder="Enter your task answer or proof here"
          required></textarea>

        <button id="submitButton" type="submit">Submit Task for Review</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer>© TechNova Guide</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>

  <script>
    const form = document.getElementById("taskForm");
    const statusBox = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const client = window.supabaseClient;

      if (!client) {
        statusBox.textContent =
          "Database connection is not ready. Please check auth.js.";
        return;
      }

      const { data: sessionData, error: sessionError } =
        await client.auth.getSession();

      if (sessionError || !sessionData.session) {
        statusBox.textContent =
          "Please log in on the home page, then return here.";
        return;
      }

      const taskId = Number(document.getElementById("taskId").value);
      const proof = document.getElementById("proof").value.trim();

      if (!Number.isSafeInteger(taskId) || taskId <= 0 || !proof) {
        statusBox.textContent = "Enter a valid task ID and proof.";
        return;
      }

      submitButton.disabled = true;
      statusBox.textContent = "Submitting your task...";

      try {
        const { error } = await client
          .from("task_submissions")
          .insert({
            user_id: sessionData.session.user.id,
            task_id: taskId,
            proof: proof
          });

        if (error) {
          console.error("Task submission error:", error.message);
          statusBox.textContent =
            "Submission failed. Check that the task ID exists and the database permits submissions.";
          return;
        }

        statusBox.textContent =
          "Submitted successfully! Your task is awaiting review.";
        form.reset();
      } catch (error) {
        console.error(error);
        statusBox.textContent =
          "Something went wrong. Please try again.";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
